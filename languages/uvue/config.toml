name = "UVUE"
grammar = "vue"
path_suffixes = ["uvue"]
block_comment = ["<!--", "-->"]
tab_size = 2
autoclose_before = ">}]"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = false },
  { start = "(", end = ")", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
]
