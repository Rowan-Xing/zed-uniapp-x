name: Verify extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify reproducible bridge release
        run: |
          python scripts/package_bridge.py --check
          if ($LASTEXITCODE -ne 0) { throw 'Bridge release metadata differs from source.' }
      - name: Prepare Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --target wasm32-wasip2
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed.' }
      - name: Download verified DCloud runtime into an isolated directory
        run: |
          .\scripts\setup.ps1 -ZedDataDirectory (Join-Path $env:RUNNER_TEMP 'uniapp-x-zed')
      - name: Check syntax, build WASM, and run real language-service tests
        run: |
          $stateFile = Join-Path $env:RUNNER_TEMP 'uniapp-x-zed\extensions\work\uniapp-x\runtime-state.json'
          $runtime = (Get-Content -LiteralPath $stateFile -Raw | ConvertFrom-Json).active.path
          .\scripts\check.ps1 -RuntimePath $runtime
      - name: Verify official package update, failure rejection, rollback, and managed launch
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'uniapp-x-zed\extensions\work\uniapp-x'
          $state = Get-Content -LiteralPath (Join-Path $cache 'runtime-state.json') -Raw | ConvertFrom-Json
          $policy = Get-Content -LiteralPath 'server\runtime-policy.json' -Raw | ConvertFrom-Json
          $vsix = Join-Path $cache "dcloud-language-services-$($policy.bootstrapVersion).vsix"
          node test/update-lifecycle.cjs --runtime $state.active.path --vsix $vsix --work test-results
          if ($LASTEXITCODE -ne 0) { throw 'Real runtime update lifecycle failed.' }
      - name: Verify packaged bridge and first launch from an empty work directory
        run: |
          $policy = Get-Content -LiteralPath 'server\runtime-policy.json' -Raw | ConvertFrom-Json
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $vsix = Join-Path $env:RUNNER_TEMP "uniapp-x-zed\extensions\work\uniapp-x\dcloud-language-services-$($policy.bootstrapVersion).vsix"
          node test/fresh-install.cjs --bridge "dist/uniapp-x-bridge-$version.tar.gz" --vsix $vsix --work test-results
          if ($LASTEXITCODE -ne 0) { throw 'Packaged fresh installation failed.' }
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-reports
          path: |
            test-results/**/report.json
            test-results/**/validation.json
            test-results/**/validation.log
            test-results/**/extract.log
          if-no-files-found: warn
          retention-days: 14
      - name: Save verified build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extension-build
          path: |
            extension.wasm
            grammars/*.wasm
            dist/uniapp-x-bridge-*.tar.gz*
            bridge-release.json
          retention-days: 14
